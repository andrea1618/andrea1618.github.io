<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="880" viewBox="0 0 1480 880" role="img" aria-labelledby="title desc">
  <title id="title">Walmart FY2026 — Revenue In, Costs &amp; Profit Out</title>
  <desc id="desc">Revenue USD 713,163M, costs USD 683,338M, Operating profit USD 29,825M. Status clean.</desc>
  <rect width="1480" height="880" fill="#fbf9f4" />
  <rect x="0.5" y="0.5" width="1479" height="879" fill="none" stroke="#e9e3d6" />
  <defs>
    <linearGradient id="grad-total" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243358" />
      <stop offset="100%" stop-color="#0b1224" />
    </linearGradient>
    <linearGradient id="grad-profit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f8a5f" />
      <stop offset="100%" stop-color="#046a47" />
    </linearGradient>
    <linearGradient id="grad-cost-total" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9d1b2f" />
      <stop offset="100%" stop-color="#d23a3a" />
    </linearGradient>
    <filter id="shadow" x="-45%" y="-20%" width="190%" height="145%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; letter-spacing: 0; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 29px; font-weight: 700; fill: #15213d; }
    .subtitle { font-size: 14px; fill: #68727c; }
    .rule { stroke: #ded6c7; stroke-width: 1; }
    .header-left { fill: #1d4ed8; font-size: 12px; font-weight: 800; letter-spacing: .06em; }
    .header-right { fill: #9d1b2f; font-size: 12px; font-weight: 800; letter-spacing: .06em; }
    .label { font-size: 13px; font-weight: 800; fill: #1f2933; }
    .metric { font-size: 11.5px; font-weight: 500; fill: #68727c; }
    .leader { fill: none; stroke: #8e958f; stroke-width: .9; opacity: .78; }
    .leader-label { font-size: 11.2px; font-weight: 700; fill: #1f2933; }
    .leader-metric { font-size: 10.8px; font-weight: 600; fill: #68727c; }
    .note { font-size: 13px; font-weight: 700; fill: #68727c; }
    .note-line { fill: none; stroke: #c7bdad; stroke-width: 1; stroke-dasharray: 4 5; }
    .box-label { font-size: 12px; fill: #68727c; font-weight: 700; }
    .box-value { font-size: 12px; fill: #1f2933; font-weight: 800; }
    .source { font-size: 10.5px; fill: #68727c; }
  </style>
  <text x="70" y="54" class="title">Walmart FY2026 — Revenue In, Costs &amp; Profit Out</text>
  <text x="70" y="82" class="subtitle">Every dollar of the USD 713.16B: where it came from (left) and where it went (right). Width = USD; % = share of total revenue.</text>
  <line x1="70" y1="122" x2="1410" y2="122" class="rule" />
  <text x="70" y="150" class="header-left">◀ REVENUE · BY LINE OF BUSINESS</text>
  <text x="1410" y="150" class="header-right" text-anchor="end">EXPENSES · BY TYPE ▶</text>
