    </g></g>
  <g class="overlays"><text x="642.0" y="198.0" class="label" text-anchor="start"><tspan x="642.0" dy="0">Total Revenue</tspan><tspan x="642.0" dy="15" class="metric">USD 713,163M · 100.0%</tspan></text>
