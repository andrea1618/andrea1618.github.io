<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="870" viewBox="0 0 1480 870" role="img" aria-labelledby="title desc">
  <title id="title">Progressive Corporation FY2025 — Revenue In, Costs &amp; Profit Out</title>
