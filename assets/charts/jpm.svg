<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="885" viewBox="0 0 1480 885" role="img" aria-labelledby="title desc">
  <title id="title">JPMorgan Chase FY2025 — Revenue In, Costs &amp; Profit Out</title>
  <desc id="desc">Revenue USD 182,447M, costs USD 109,852M, Pretax profit USD 72,595M. Status clean.</desc>
  <rect width="1480" height="885" fill="#fbf9f4" />
  <rect x="0.5" y="0.5" width="1479" height="884" fill="none" stroke="#e9e3d6" />
